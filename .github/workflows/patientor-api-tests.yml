name: Patientor API Tests

on:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install patientor backend dependencies
        working-directory: ./patientor/backend
        run: npm install --legacy-peer-deps

      - name: Lint patientor backend
        working-directory: ./patientor/backend
        run: npm run lint

      - name: Build patientor backend
        working-directory: ./patientor/backend
        run: npm run build

      - name: Start patientor backend server
        working-directory: ./patientor/backend
        run: |
          set -euo pipefail
          npm start > server.log 2>&1 &
          echo $! > server.pid

          for i in $(seq 1 15); do
            if curl --silent --fail http://localhost:3001/api/ping; then
              echo "Backend is ready"
              exit 0
            fi

            if ! kill -0 "$(cat server.pid)" >/dev/null 2>&1; then
              echo "Backend process died. Server log:"
              cat server.log
              exit 1
            fi

            sleep 1
          done

          echo "Backend did not start in time"
          cat server.log
          exit 1

      - name: Install test dependencies
        working-directory: ./patientor-api-tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: ./patientor-api-tests
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        working-directory: ./patientor-api-tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: patientor-api-tests/playwright-report/
          retention-days: 30

      - name: Stop patientor backend server
        if: always()
        working-directory: ./patientor/backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

